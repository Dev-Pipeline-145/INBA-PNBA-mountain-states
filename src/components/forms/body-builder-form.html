<div class="registration-form">
    <h3 class="registration-form__title">Register for Competition</h3>
    <form class="form" id="registrationForm">
        <div class="form-group">
            <label for="reg-name" class="form-label">Full Name *</label>
            <input type="text" id="reg-name" name="name" class="form-input" required>
        </div>
        <div class="form-group">
            <label for="reg-email" class="form-label">Email Address *</label>
            <input type="email" id="reg-email" name="email" class="form-input" required>
        </div>
        <div class="form-group">
            <label for="reg-phone" class="form-label">Phone Number *</label>
            <input type="tel" id="reg-phone" name="phone" class="form-input" required>
        </div>
        <div class="form-group">
            <label for="reg-show" class="form-label">Select Show *</label>
            <select id="reg-show" name="show" class="form-select" required>
                <option value="">Choose a competition</option>
                <option value="utah-state-naturals">Utah State Naturals - March 15, 2025</option>
                <option value="colorado-rapids">Colorado Rapids - June 22, 2025</option>
                <option value="red-rock-classic">Red Rock Classic - September 14, 2025</option>
                <option value="night-of-champions">Night of Champions - December 7, 2025</option>
            </select>
        </div>
        <div class="form-group">
            <label for="reg-division" class="form-label">Division *</label>
            <select id="reg-division" name="division" class="form-select" required>
                <option value="">Select your division</option>
                <option value="mens-physique">Men's Physique</option>
                <option value="womens-bikini">Women's Bikini</option>
                <option value="classic-physique">Classic Physique</option>
                <option value="bodybuilding">Bodybuilding</option>
                <option value="wellness">Wellness</option>
            </select>
        </div>
        <div class="form-group">
            <label for="reg-experience" class="form-label">Competition Experience</label>
            <select id="reg-experience" name="experience" class="form-select">
                <option value="first-time">First Time Competitor</option>
                <option value="1-2">1-2 Previous Competitions</option>
                <option value="3-5">3-5 Previous Competitions</option>
                <option value="6+">6+ Previous Competitions</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-checkbox">
                <input type="checkbox" name="terms" required>
                <span class="form-checkbox__text">I agree to the <a href="#terms" class="form-link">Terms & Conditions</a> and <a href="#privacy" class="form-link">Privacy Policy</a> *</span>
            </label>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn--primary btn--lg">Register Now</button>
        </div>
    </form>
</div>
